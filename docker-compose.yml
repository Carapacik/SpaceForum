name: spaceforum

x-web-image: &web-image
  image: spaceforum-web:local
  build:
    context: .
    dockerfile: Dockerfile

services:
  data-protection-init:
    image: spaceforum-web:local
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R $${APP_UID}:$${APP_UID} /keys"]
    volumes:
      - data-protection-keys:/keys
    restart: "no"

  mail:
    image: axllent/mailpit:v1.30.0
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mail-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: spaceforum
      POSTGRES_USER: spaceforum
      POSTGRES_PASSWORD: spaceforum_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spaceforum -d spaceforum"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  s3:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: spaceforum
      MINIO_ROOT_PASSWORD: spaceforum_s3_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3-data:/data
    restart: unless-stopped

  migrate:
    <<: *web-image
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=spaceforum;Username=spaceforum;Password=spaceforum_dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    <<: *web-image
    command: ["--seed-demo"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=spaceforum;Username=spaceforum;Password=spaceforum_dev
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  web:
    <<: *web-image
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=spaceforum;Username=spaceforum;Password=spaceforum_dev
      Email__Smtp__Host: mail
      S3__ServiceUrl: http://s3:9000
      S3__AccessKey: spaceforum
      S3__SecretKey: spaceforum_s3_dev
      S3__BucketName: spaceforum-media
    ports:
      - "8080:8080"
    volumes:
      - data-protection-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      data-protection-init:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      mail:
        condition: service_started
      s3:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  mail-data:
  data-protection-keys:
  s3-data:
